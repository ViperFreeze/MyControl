name: Compiler l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compiler
        run: gradle assembleDebug

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MyControl.apk

      # Artifact téléchargeable depuis l'onglet Actions (comme avant)
      - uses: actions/upload-artifact@v4
        with:
          name: MyControl-apk
          path: MyControl.apk

      # Release "latest" : lien de téléchargement direct, pratique sur téléphone
      - name: Publier la Release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Dernière version
          body: |
            Dernier APK compilé automatiquement à partir de la branche `main`.
            Télécharge **MyControl.apk** ci-dessous et installe-le sur le téléphone.
          files: MyControl.apk
          make_latest: true
